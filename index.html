<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bộ Khoa học và Công nghệ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          screens: {
            'sm': '576px',
            'md': '768px',
            'lg': '1024px',
            'xl': '1200px',
            '2xl': '1440px',
          },
          container: {
            center: true,
            padding: {
              DEFAULT: '1rem', // 16px margin for mobile
              md: '1.5rem',     // 24px margin for tablet
            },
            screens: {
               // On screens smaller than xl, container is fluid (100% width)
               // with padding providing the margins.
               xl: '1140px',  // max-width for laptop/desktop
               '2xl': '1320px', // max-width for large desktop
            },
          },
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
            },
            colors: {
              'most-red': '#CE1126',
              'most-navy': '#003971',
              'most-yellow': '#F2C94C',
              'most-secondary-bg': '#F3F6FB',
              'most-electric-blue': '#00BFFF',
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body class="font-body bg-most-secondary-bg text-gray-800">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
